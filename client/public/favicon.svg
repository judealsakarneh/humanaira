<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#35BFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2BA3E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0A0F1F"/>
  
  <!-- Letters h, a, i -->
  <text x="32" y="42" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="32" fill="url(#grad)" text-anchor="middle">
    <tspan fill="#35BFFF">h</tspan><tspan fill="#fff">a</tspan><tspan fill="#35BFFF">i</tspan>
  </text>
</svg>
